# Auto-deploy ขึ้น Railway ทุกครั้งที่ push main
# (GitHub Pages มีระบบ deploy อัตโนมัติของตัวเองอยู่แล้ว — push ครั้งเดียวอัปเดตทั้งสองที่)
name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # เผื่อกดรันเองจากหน้า Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Link project
        run: railway link --project 5d468e43-20cb-47cc-a49d-ef0b84dc7f3e --environment production --service 543f358a-8154-4342-b333-0a91f9ad2853
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      - name: Deploy
        run: railway up --detach --service 543f358a-8154-4342-b333-0a91f9ad2853
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
